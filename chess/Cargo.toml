[workspace]
resolver = "3"
members = ["core", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Firmware builds use the release profile (see scripts/build_chess_core.py).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
